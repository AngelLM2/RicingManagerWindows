name: Bug report
description: Something does not work or broke your Windows settings
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must NOT be reported here — see SECURITY.md.
        Tip: "Restore original Windows" (or `rmw restore --original`) undoes every change made by the app.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Apply rice "…"
        2. Disconnect monitor 2
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: rmw --version
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 Pro 25H2 (26200.xxxx)
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Monitors (count, resolution, scaling, HDR), GPU, other customization tools running
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach logs from %LOCALAPPDATA%\RicingManagerWindows\logs (user paths are already redacted)
